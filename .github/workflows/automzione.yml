name: Aggiornamento Dati Energia

# Quando deve attivarsi il robot?
on:
  schedule:
    # Si attiva al minuto 0 e 30 di ogni ora (es. 10:00, 10:30, 11:00...)
    - cron: '0,30 * * * *'
  # Permette di premere il tasto "Play" anche manualmente dal sito di GitHub
  workflow_dispatch:

jobs:
  estrai-e-salva:
    # Accendi un computer Linux gratuito fornito da GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 1. Scarica il codice del nostro progetto
      uses: actions/checkout@v4

    - name: 2. Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 3. Installa le librerie (Pandas, DuckDB, ecc.)
      run: |
        pip install -r requirements.txt

    - name: 4. Esegui l'estrazione dati
      # Prendi la password segreta dalla cassaforte e passala allo script
      env:
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      run: |
        if [ -z "$MOTHERDUCK_TOKEN" ]; then
          echo "::error::Il secret MOTHERDUCK_TOKEN non e' configurato nel repository."
          exit 1
        fi
        python main.py
