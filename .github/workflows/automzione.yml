name: Aggiornamento Dati Energia

# Quando deve attivarsi il robot?
on:
  schedule:
    # Una volta al giorno alle 06:00 UTC (08:00 in Italia)
    - cron: '0 6 * * *'
  # Permette di premere il tasto "Play" anche manualmente dal sito di GitHub
  workflow_dispatch:

# Serve per poter salvare (commit) i dati aggiornati nel repository
permissions:
  contents: write

jobs:
  estrai-e-salva:
    # Accendi un computer Linux gratuito fornito da GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 1. Scarica il codice del nostro progetto
      uses: actions/checkout@v4

    - name: 2. Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 3. Installa le librerie (Pandas, DuckDB, ecc.)
      run: |
        pip install -r requirements.txt

    - name: 4. Esegui l'estrazione dati
      run: |
        python main.py

    - name: 5. Salva i dati aggiornati nel repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add energy_project.duckdb
        if git diff --cached --quiet; then
          echo "Nessuna modifica ai dati, niente da salvare."
        else
          git commit -m "Aggiornamento dati automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        fi
